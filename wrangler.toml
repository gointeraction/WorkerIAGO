name = "workeriago"
main = "src/index.ts"
compatibility_date = "2024-08-01"
compatibility_flags = ["nodejs_compat"]

# =============================================================================
# CLOUDFLARE AI - Workers AI para LLMs, embeddings, imágenes
# =============================================================================
[ai]
binding = "AI"

# =============================================================================
# D1 DATABASE - Conversaciones, leads, configuración
# =============================================================================
[[d1_databases]]
binding = "DB"
database_name = "workeriago-db"
database_id = "98d488d9-41ed-48b8-b972-593379718782"

# =============================================================================
# VECTORIZE - Base de conocimiento RAG (embeddings bge-m3)
# =============================================================================
[[vectorize]]
binding = "VECTORIZE"
index_name = "workeriago-vectors"

# =============================================================================
# KV - Cache de respuestas y sesiones
# =============================================================================
[[kv_namespaces]]
binding = "CACHE"
id = "d6e50404a6ab4ddaabcecc323acaaa40"

# =============================================================================
# R2 - Media (imágenes, audios, documentos)
# Habilita R2 en Cloudflare Dashboard → R2, luego descomenta
# =============================================================================
# [[r2_buckets]]
# binding = "STORAGE"
# bucket_name = "workeriago-storage"

# =============================================================================
# DURABLE OBJECTS - Estado de conversaciones y agentes stateful
# =============================================================================
[durable_objects]
bindings = [
  { name = "AGENT_STATE", class_name = "AgentState" }
]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["AgentState"]

# =============================================================================
# SCHEDULED FUNCTIONS - Cron jobs para tareas automáticas
# =============================================================================
[scheduled]
cron = "0 3 * * *"  # Diario a las 3am UTC

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================
# Configurar con: wrangler secret put NOMBRE_VARIABLE
#
# Canales de mensajería:
#   TELEGRAM_BOT_TOKEN: token de @BotFather
#   WHATSAPP_TOKEN: token de WhatsApp Business API
#   WHATSAPP_PHONE_ID: Phone Number ID de WhatsApp
#
# Seguridad:
#   ADMIN_PASSWORD: contraseña del panel de administración
# =============================================================================

[vars]
ENVIRONMENT = "development"
BOT_NAME = "WorkerIAGO"
BUSINESS_NAME = "Mi Negocio"
BOT_LANGUAGE = "es"
BUFFER_SECONDS = "15"
DASHBOARD_BASE_URL = "https://workeriago.ibohorquez.workers.dev"
